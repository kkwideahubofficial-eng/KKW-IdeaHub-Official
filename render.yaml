version: 1
services:
  - type: web
    name: ideahub-backend-service
    runtime: node
    rootDir: innovate-hub-core/backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: NODE_VERSION
        value: "20"

  - type: web
    name: snapcart-socket-service
    runtime: node
    rootDir: innovate-hub-core/snapcart/socket
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NEXT_BASE_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: NODE_VERSION
        value: "20"

  - type: web
    name: snapcart-driver-service
    runtime: node
    rootDir: innovate-hub-core/snapcart/frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_SOCKET_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: NODE_VERSION
        value: "20"
