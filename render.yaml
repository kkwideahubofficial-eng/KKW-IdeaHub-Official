services:
  # 1. Main Backend (Express/Node)
  - type: web
    name: innovate-hub-backend
    env: node
    region: singapore
    plan: free
    rootDir: innovate-hub-core/backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false # Set to Main Frontend URL

  # 2. Socket Server (Node/Socket.io)
  - type: web
    name: snapcart-socket
    env: node
    region: singapore
    plan: free
    rootDir: innovate-hub-core/snapcart/socket
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NEXT_BASE_URL
        sync: false # Point to Driver App URL

  # 3. Driver App & SnapCart Frontend (Next.js)
  - type: web
    name: snapcart-frontend
    env: node
    region: singapore
    plan: free
    rootDir: innovate-hub-core/snapcart/frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SOCKET_SERVER
        fromService:
            type: web
            name: snapcart-socket
            property: url
      - key: EMAIL
        sync: false
      - key: PASS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # 4. Main Website (Static Site)
  - type: static
    name: innovate-hub-frontend
    env: static
    region: singapore
    plan: free
    rootDir: innovate-hub-core
    buildCommand: npm install && npm run build
    staticPublishPath: dist
