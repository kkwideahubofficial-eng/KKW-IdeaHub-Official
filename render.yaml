services:
  - type: web
    name: ideahub-api
    runtime: node
    root: innovate-hub-core/backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGO_URI
      - key: CLIENT_URL

  - type: web
    name: snapcart-socket
    runtime: node
    root: innovate-hub-core/snapcart/socket
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_BASE_URL

  - type: web
    name: snapcart-driver
    runtime: node
    root: innovate-hub-core/snapcart/frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
      - key: NEXTAUTH_SECRET
      - key: NEXTAUTH_URL
      - key: NEXT_PUBLIC_SOCKET_URL
