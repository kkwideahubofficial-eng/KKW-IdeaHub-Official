services:
  # 1. IdeaHub Backend API (Express.js)
  - type: web
    name: ideahub-backend-service
    env: node
    plan: free
    root: innovate-hub-core/backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: NODE_VERSION
        value: "20"

  # 2. Snapcart Socket Server (Node.js)
  - type: web
    name: snapcart-socket-service
    env: node
    plan: free
    root: innovate-hub-core/snapcart/socket
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NEXT_BASE_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: NODE_VERSION
        value: "20"

  # 3. Snapcart Driver App (Next.js)
  - type: web
    name: snapcart-driver-service
    env: node
    plan: free
    root: innovate-hub-core/snapcart/frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_SOCKET_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: NODE_VERSION
        value: "20"
