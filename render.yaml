version: 1
services:

  # 1. IdeaHub Backend API
  - type: web
    name: ideahub-backend-service
    runtime: node
    root: innovate-hub-core/backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false

  # 2. Snapcart Socket Server
  - type: web
    name: snapcart-socket-service
    runtime: node
    root: innovate-hub-core/snapcart/socket
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: NEXT_BASE_URL
        sync: false

  # 3. Snapcart Driver App (Next.js)
  - type: web
    name: snapcart-driver-service
    runtime: node
    root: innovate-hub-core/snapcart/frontend
    buildCommand: npm install && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: MONGODB_URI
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_SOCKET_URL
        fromService:
          type: web
          name: snapcart-socket-service
          property: url
