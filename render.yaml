services:
- type: web
  name: ideahub-backend
  runtime: node
  plan: free
  root: innovate-hub-core/backend
  buildCommand: npm install
  startCommand: node src/server.js
  envVars:
  - key: MONGO_URI
    sync: false
  - key: CLIENT_URL
    sync: false

- type: web
  name: snapcart-socket
  runtime: node
  plan: free
  root: innovate-hub-core/snapcart/socket
  buildCommand: npm install
  startCommand: node index.js
  envVars:
  - key: NEXT_BASE_URL
    sync: false

- type: web
  name: snapcart-driver-app
  runtime: node
  plan: free
  root: innovate-hub-core/snapcart/frontend
  buildCommand: npm install && npm run build
  startCommand: npm start
  envVars:
  - key: MONGODB_URI
    sync: false
  - key: NEXTAUTH_SECRET
    sync: false
  - key: NEXTAUTH_URL
    sync: false
  - key: NEXT_PUBLIC_SOCKET_URL
    fromService:
      type: web
      name: snapcart-socket
      property: url
